name: Generate and Publish Article HTML
on:
  repository_dispatch:
    types: [publish_article]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JavaScript Generator Script
        env:
          ARTICLE_DATA: ${{ github.event.client_payload.article }}
        run: |
          node scripts/generate-page.js

      - name: Commit and Push New HTML to GitHub Pages
        run: |
          git config --global user.name "MedStart Bot"
          git config --global user.email "bot@medstart.com"
          git add .
          git commit -m "Automated HTML generation for new article"
          git push
